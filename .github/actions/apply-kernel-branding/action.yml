name: 'Apply HzzMonet Kernel Branding'
description: 'Apply the HzzMonet suffix to the kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        # The base version comes from the kernel Makefile (for example
        # 5.15.178). setlocalversion must only add the suffix; emitting the
        # complete version here would duplicate the base version.
        sed -i '$d' scripts/setlocalversion
        echo 'echo "-HzzMonet"' >> scripts/setlocalversion
        chmod +x scripts/setlocalversion
